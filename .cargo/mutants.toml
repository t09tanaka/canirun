# Only the pure decision modules are gated; everything else is covered by
# the end-to-end tests in tests/cli.rs, where mutation runs would mostly
# measure timing and process plumbing.
examine_globs = ["src/admit.rs", "src/weight.rs", "src/key.rs", "src/eta.rs", "src/forecast.rs"]
# Loop bounds that are never reached: a bigger or smaller bound gives the
# same answers, and the loop cannot run away.
exclude_re = ["iteration_cap"]
