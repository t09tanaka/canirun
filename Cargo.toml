[package]
name = "task-traffic-controller"
version = "0.7.0"
edition = "2021"
rust-version = "1.89"
description = "A local admission controller that gates heavy commands behind a shared CPU budget and learns their weight"
license = "MIT"
repository = "https://github.com/t09tanaka/task-traffic-controller"
homepage = "https://github.com/t09tanaka/task-traffic-controller"
readme = "README.md"
keywords = ["ci", "concurrency", "throttle", "semaphore", "dev-tools"]
categories = ["command-line-utilities", "development-tools"]
include = ["src/**/*", "tests/**/*", "examples/**/*", "README.md", "CHANGELOG.md", "LICENSE"]

[lib]
name = "task_traffic_controller"
path = "src/lib.rs"

[[bin]]
name = "task-traffic-controller"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
fs2 = "0.4"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
libc = "0.2"
globset = "0.4"
uuid = { version = "1", features = ["v4"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
ratatui = "0.30.2"

[dev-dependencies]
tempfile = "3"
